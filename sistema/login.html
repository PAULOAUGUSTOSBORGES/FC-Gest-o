<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- Anti-FOUC: Previne flash branco ao alternar páginas no sistema -->
    <script>
        (function() {
            const t = localStorage.getItem('fc_theme_sistema') || 'dark';
            if (t === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root { color-scheme: dark; background-color: #0f172a; }
        html, body { background-color: #0f172a; }
        html.light, html.light body, html[data-theme="light"], html[data-theme="light"] body { background-color: #f1f5f9; color-scheme: light; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA Configurações e Ícones -->
    <script>if (window.location.protocol.startsWith('http')) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = '../manifest.json'; document.head.appendChild(l); }</script>
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FC Gestão">
    <link rel="apple-touch-icon" href="../icons/icon-v2-apple-touch.png">
    <link rel="icon" type="image/png" href="../icons/favicon-v2.png">
    <title>Acesso - FC Gestão | ERP & PDV</title>
        
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=20261020085630">
    <link rel="stylesheet" href="../tailwind-built.css?v=20261020085630">
</head>
<body class="flex min-h-screen min-h-[100dvh] bg-slate-900 text-slate-800 dark:text-slate-100 items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center relative overflow-hidden my-auto max-h-[95vh] overflow-y-auto custom-scrollbar">
        
        <img src="../icons/icone_oficial.png" class="w-16 h-16 rounded-2xl mx-auto object-contain mb-4 shadow-xl shadow-blue-500/40" alt="Logo FC Gestão">
        <!-- Título e Subtítulo -->
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1" id="titulo-form">FC Gestão</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-6" id="subtitulo-form">Portal de Acesso para Lojistas e Funcionários</p>
        
        <!-- Abas de Alternância: Entrar vs Criar Conta (7 Dias Grátis) -->
        <div class="flex items-center border-b border-slate-200 dark:border-slate-700 mb-5">
            <button id="tab-login" type="button" onclick="alternarModoAuth('login')" class="flex-1 pb-2.5 font-bold text-sm text-blue-600 border-b-2 border-blue-600 transition-colors cursor-pointer">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> Entrar
            </button>
            <button id="tab-cadastro" type="button" onclick="alternarModoAuth('cadastro')" class="flex-1 pb-2.5 font-bold text-sm text-slate-400 border-b-2 border-transparent hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-sparkles text-amber-500"></i> Criar Conta <span class="bg-amber-500/20 text-amber-500 text-[10px] font-black px-1.5 py-0.5 rounded-full border border-amber-500/30">7d Grátis</span>
            </button>
        </div>

        <!-- Formulário de Login Oficial -->
        <form id="form-login" onsubmit="event.preventDefault(); acaoPrincipal();" class="space-y-3.5 mb-5 text-left">
            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">E-mail Cadastrado</label>
                <input type="email" id="login-user" required autocomplete="username" placeholder="seuemail@empresa.com" aria-label="E-mail" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Senha de Acesso</label>
                <div class="relative">
                    <input type="password" id="login-pass" required autocomplete="current-password" placeholder="••••••••" aria-label="Senha" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm pr-10">
                    <button type="button" onclick="toggleMostrarSenha('login-pass')" aria-label="Mostrar ou ocultar senha" class="absolute right-3 top-2.5 text-slate-400 hover:text-white transition-colors cursor-pointer">
                        <i id="icone-olho-senha" class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>
            </div>

            <button id="btn-acao" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-lg transition-colors shadow-md touch-manipulation cursor-pointer flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-right-to-bracket mr-1.5"></i> Entrar no Sistema
            </button>
        </form>

        <!-- Formulário de Cadastro Grátis (7 Dias de Teste) -->
        <form id="form-cadastro-trial" onsubmit="event.preventDefault(); fazerCadastroGratuitoTrial();" class="space-y-3 mb-5 text-left hidden">
            <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 text-xs text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-gift text-base shrink-0"></i>
                <span><strong>7 Dias Grátis:</strong> Teste o ERP, PDV e Emissor Fiscal sem cartão de crédito!</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Nome da sua Loja / Empresa *</label>
                <input type="text" id="cad-nome-empresa" required placeholder="Ex: Móveis & Decoração Express" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Seu Nome Completo *</label>
                <input type="text" id="cad-responsavel" required placeholder="Ex: Carlos Silva" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">WhatsApp / Celular *</label>
                <input type="tel" id="cad-whatsapp" required placeholder="(00) 00000-0000" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">E-mail para Acesso *</label>
                <input type="email" id="cad-email" required placeholder="seuemail@loja.com" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Criar Senha (mínimo 6 dígitos) *</label>
                <input type="password" id="cad-senha" required minlength="6" placeholder="••••••••" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-3.5 py-2.5 rounded-lg focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
            </div>

            <button id="btn-cad-trial" type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black py-3.5 rounded-lg transition-all shadow-md touch-manipulation cursor-pointer flex items-center justify-center gap-2">
                <i class="fa-solid fa-rocket"></i> Iniciar Teste Gratuito de 7 Dias
            </button>
        </form>
        
        <!-- Divisor OU (Apenas no Login) -->
        <div id="divisor-social" class="flex items-center my-4">
            <div class="flex-1 border-t border-slate-200 dark:border-slate-700"></div>
            <span class="px-3 text-xs text-slate-400 dark:text-slate-500 uppercase font-semibold">ou</span>
            <div class="flex-1 border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Botão Google -->
        <button id="btn-google" type="button" onclick="fazerLoginGoogle()" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold py-3 px-4 rounded-lg border border-slate-300 dark:border-slate-700 transition shadow-sm active:scale-[0.98] cursor-pointer">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="txt-btn-google">Entrar com Google</span>
        </button>
        
        <p class="mt-4 text-sm text-slate-500" id="esqueci-senha-link">
            <a href="#" onclick="esqueciSenha(); return false;" class="text-blue-500 hover:underline">Esqueci minha senha</a>
        </p>

        <!-- Bloqueio de auto-cadastro: direciona para assinar na Primas.Tech -->
        <div class="mt-6 pt-5 border-t border-slate-200 dark:border-slate-700/80 text-center">
            <p class="text-xs text-slate-500 dark:text-slate-400 mb-2 font-medium">Ainda não possui uma loja ou assinatura ativa?</p>
            <a href="https://primas.tech/acesso.html" class="inline-flex items-center justify-center gap-2 w-full py-2.5 px-4 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 text-blue-600 dark:text-blue-400 border border-slate-200 dark:border-slate-600 transition-all">
                <i class="fa-solid fa-layer-group"></i> Conhecer Planos & Ativar Loja em Primas.Tech &rarr;
            </a>
        </div>

        <!-- Rodapé do Card de Login: Empresa Criadora & Versão -->
        <div class="mt-5 pt-3 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 select-none">
            <a href="https://primas.tech" target="_blank" rel="noopener noreferrer" class="flex items-center gap-1.5 hover:text-blue-500 transition-colors group">
                <img src="../icons/icone_primas.png" class="w-4 h-4 object-contain rounded" alt="Primas Tecnologia" onerror="this.style.display='none'">
                <span class="text-[11px]">Criado por <strong class="text-slate-700 dark:text-slate-200 group-hover:text-blue-400">Primas Tecnologia</strong></span>
            </a>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-mono font-bold bg-blue-50 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 border border-blue-200 dark:border-blue-800/60">v1.0</span>
        </div>
    </div>

    <!-- Alternar visualização da senha -->
    <script>
        function toggleMostrarSenha() {
            const passInput = document.getElementById('login-pass');
            const icon = document.getElementById('icone-olho-senha');
            if (!passInput) return;
            if (passInput.type === 'password') {
                passInput.type = 'text';
                if (icon) {
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                }
            } else {
                passInput.type = 'password';
                if (icon) {
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            }
        }
    </script>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="../sistema/config_banco.js?v=20261020085630"></script>
    <script src="saas_licenca.js?v=20261020085630"></script>
    <script src="../global.js?v=20261020085630"></script>
    <script src="fc_cache.js?v=20261020085630"></script>
    <script src="login.js?v=20261020085630"></script>
</body>
</html>
