<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 320" width="512" height="320">
  <defs>
    <filter id="glow-l" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="neon-l" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card-l" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro -->
  <rect width="512" height="320" rx="32" fill="#1e293b" />

  <!-- Glow do Ícone -->
  <ellipse cx="256" cy="120" rx="90" ry="80" fill="url(#neon-l)" filter="url(#glow-l)" opacity="0.95" />

  <!-- Squircle do Ícone -->
  <rect x="181" y="45" width="150" height="150" rx="38" fill="url(#card-l)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />

  <!-- Camadas 3D -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 256,82 L 295,101 C 297,102 297,104 295,105 L 256,124 C 254,125 252,125 250,124 L 211,105 C 209,104 209,102 211,101 L 250,82 C 252,81 254,81 256,82 Z" />
    <path d="M 213,116 L 251,135 C 254,136 258,136 261,135 L 299,116 C 301,115 302,117 301,118 L 258,140 C 256,141 254,141 252,140 L 209,118 C 208,117 209,115 213,116 Z" />
    <path d="M 213,133 L 251,152 C 254,153 258,153 261,152 L 299,133 C 301,132 302,134 301,135 L 258,157 C 256,158 254,158 252,157 L 209,135 C 208,134 209,132 213,133 Z" />
  </g>

  <!-- Tipografia Oficial FC Gestão -->
  <text x="256" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">FC Gestão</text>
</svg>
