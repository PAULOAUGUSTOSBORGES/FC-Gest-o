<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- Anti-FOUC: Previne flash branco ao alternar páginas no sistema -->
    <script>
        (function() {
            const t = localStorage.getItem('fc_theme_sistema') || 'dark';
            if (t === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root { color-scheme: dark; background-color: #0f172a; }
        html, body { background-color: #0f172a; }
        html.light, html.light body, html[data-theme="light"], html[data-theme="light"] body { background-color: #f1f5f9; color-scheme: light; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA Configurações e Ícones -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FC Gestão">
    <link rel="apple-touch-icon" href="../icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" href="../icons/favicon.png">
    <title>Acesso - FC Móveis</title>
        
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=20260919122209">
    <link rel="stylesheet" href="../tailwind-built.css?v=20260919122209">
</head>
<body class="flex h-screen bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
        
        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-blue-500/50">
            <i class="fa-solid fa-couch"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1" id="titulo-form">FC Móveis</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-4" id="subtitulo-form">Acesso ao sistema integrado</p>

        <!-- Tabs Login / Register -->
        <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
            <button id="tab-login" onclick="mudarAbaLogin('login')" class="flex-1 pb-2 font-bold text-blue-600 border-b-2 border-blue-600 transition-colors">Entrar</button>
            <button id="tab-register" onclick="mudarAbaLogin('register')" class="flex-1 pb-2 font-bold text-slate-400 border-b-2 border-transparent transition-colors hover:text-slate-600 dark:hover:text-slate-300">Criar Conta</button>
        </div>
        
        <!-- Formulário -->
        <input type="text" id="login-empresa" placeholder="Nome da Sua Loja" aria-label="Nome da Sua Loja" class="hidden w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-4 focus:outline-none focus:border-blue-500 font-medium dark:text-white">
        
        <input type="email" id="login-user" placeholder="E-mail" aria-label="E-mail" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-4 focus:outline-none focus:border-blue-500 font-medium dark:text-white">
        
        <input type="password" id="login-pass" placeholder="Senha" aria-label="Senha" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-6 focus:outline-none focus:border-blue-500 font-medium dark:text-white" onkeypress="if(event.key === 'Enter') acaoPrincipal()">
        
        <button id="btn-acao" onclick="acaoPrincipal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">Entrar</button>
        
        <p class="mt-4 text-sm text-slate-500" id="esqueci-senha-link">
            <a href="#" onclick="esqueciSenha(); return false;" class="text-blue-500 hover:underline">Esqueci minha senha</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="../sistema/config_banco.js?v=20260919122209"></script>
    <script src="../global.js?v=20260919122209"></script>
    <script src="login.js?v=20260919122209"></script>
</body>
</html>
