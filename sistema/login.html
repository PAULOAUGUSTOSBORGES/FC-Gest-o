<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA ConfiguraÃ§Ãµes e Ãcones -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FC Gestão">
    <link rel="apple-touch-icon" href="../icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" href="../icons/favicon.png">
    <title>Acesso - FC Móveis</title>
        
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=20260902202810">
    <link rel="stylesheet" href="../tailwind-built.css?v=20260902202810">
</head>
<body class="flex h-screen bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center relative overflow-hidden">
        
        <!-- Toggle Tabs -->
        <div class="flex mb-6 border-b border-slate-200 dark:border-slate-700">
            <button id="tab-login" onclick="mudarAbaLogin('login')" class="flex-1 pb-2 font-bold text-blue-600 border-b-2 border-blue-600 transition-colors">Entrar</button>
            <button id="tab-register" onclick="mudarAbaLogin('register')" class="flex-1 pb-2 font-bold text-slate-400 border-b-2 border-transparent transition-colors hover:text-slate-600 dark:hover:text-slate-300">Criar Conta</button>
        </div>

        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-blue-500/50">
            <i class="fa-solid fa-couch"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1" id="titulo-form">FC Móveis</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-6" id="subtitulo-form">Acesso ao sistema integrado</p>
        
        <!-- Formulário (Usado para Login e Cadastro) -->
        <input type="email" id="login-user" placeholder="E-mail" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-4 focus:outline-none focus:border-blue-500 font-medium dark:text-white">
        <input type="password" id="login-pass" placeholder="Senha" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-6 focus:outline-none focus:border-blue-500 font-medium dark:text-white" onkeypress="if(event.key === 'Enter') acaoPrincipal()">
        
        <button id="btn-acao" onclick="acaoPrincipal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">Entrar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="../sistema/config_banco.js?v=20260902202810"></script>
    <script src="../global.js?v=20260902202810"></script>
    <script src="login.js?v=20260902202810"></script>
</body>
</html>
