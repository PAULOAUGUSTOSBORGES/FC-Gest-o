<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Master - Acesso do Fundador</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=20260917145522">
    <link rel="stylesheet" href="../tailwind-built.css?v=20260917145522">
    <style>
        :root { color-scheme: dark; }
        body { background: radial-gradient(circle at top, #1e1b4b 0%, #0f172a 60%, #020617 100%); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-slate-100 p-4">

    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-amber-500/30 rounded-3xl p-8 shadow-2xl shadow-amber-500/10 space-y-6">
        
        <!-- HEADER COM COROA -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-950 text-2xl shadow-lg shadow-amber-500/20 mb-2">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h1 class="text-2xl font-black text-white tracking-tight">Portal do Fundador</h1>
            <p class="text-xs text-amber-400/90 font-semibold uppercase tracking-widest">Painel Master de Controle SaaS</p>
            <p class="text-xs text-slate-400">Gerenciamento global de clientes, assinaturas e faturamento.</p>
        </div>

        <!-- FORMULÁRIO -->
        <form onsubmit="fazerLoginMaster(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">E-mail do Administrador</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input type="email" id="master-email" required value="pauloaugusto.silvaborges@gmail.com" class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all placeholder-slate-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Senha de Acesso</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-500"></i>
                    <input type="password" id="master-senha" required placeholder="••••••••" class="w-full pl-10 pr-4 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-sm font-medium text-white outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all placeholder-slate-500">
                </div>
            </div>

            <button type="submit" id="btn-entrar-master" class="w-full py-3.5 rounded-xl font-extrabold text-sm bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-400 hover:from-amber-600 hover:to-yellow-500 text-slate-950 transition-all transform hover:scale-[1.01] active:scale-[0.99] shadow-lg shadow-amber-500/25 flex items-center justify-center gap-2 cursor-pointer mt-2">
                <i class="fa-solid fa-right-to-bracket"></i> Acessar Painel Master
            </button>
        </form>

        <div class="border-t border-slate-800 pt-4 text-center">
            <a href="../sistema/login.html" class="text-xs text-slate-400 hover:text-slate-200 transition-colors flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i> Ir para o sistema de lojistas
            </a>
        </div>

    </div>

    <!-- Scripts do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="../sistema/config_banco.js?v=20260917145522"></script>
    <script src="master.js?v=20260917145522"></script>
</body>
</html>
