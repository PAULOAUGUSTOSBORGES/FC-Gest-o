<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="neon" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#0f172a" />

  <!-- Neon Blue Glow -->
  <ellipse cx="256" cy="270" rx="165" ry="150" fill="url(#neon)" filter="url(#glow)" opacity="0.95" />

  <!-- App Card Squircle -->
  <rect x="116" y="106" width="280" height="280" rx="70" fill="url(#card)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- 3D Stacked Layers (Camadas Isométricas) -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Top Layer (Rhombus) -->
    <path d="M 256,175 L 328,210 C 332,212 332,216 328,218 L 256,253 C 252,255 248,255 244,253 L 172,218 C 168,216 168,212 172,210 L 244,175 C 248,173 252,173 256,175 Z" />
    
    <!-- Middle Layer (Chevron) -->
    <path d="M 175,238 L 246,273 C 252,276 260,276 266,273 L 337,238 C 340,236 343,239 341,242 L 261,282 C 258,284 254,284 251,282 L 171,242 C 169,239 172,236 175,238 Z" />
    
    <!-- Bottom Layer (Chevron) -->
    <path d="M 175,270 L 246,305 C 252,308 260,308 266,305 L 337,270 C 340,268 343,271 341,274 L 261,314 C 258,316 254,316 251,314 L 171,274 C 169,271 172,268 175,270 Z" />
  </g>
</svg>
