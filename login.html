<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TintasERP</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen bg-slate-900 text-slate-800 flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-blue-500/50">
            <i class="fa-solid fa-droplet"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 mb-1">TintasERP</h1>
        <p class="text-slate-500 text-sm mb-6">Acesso ao sistema integrado</p>
        <input type="text" id="login-user" placeholder="Usuário (admin)" class="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-lg mb-4 focus:outline-none focus:border-blue-500 font-medium">
        <input type="password" id="login-pass" placeholder="Senha (123)" class="w-full bg-slate-50 border border-slate-300 px-4 py-3 rounded-lg mb-6 focus:outline-none focus:border-blue-500 font-medium" onkeypress="if(event.key === 'Enter') fazerLogin()">
        <button onclick="fazerLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">Entrar</button>
    </div>

    <!-- Script exclusivo para o Login -->
    <script src="login.js"></script>
</body>
</html>
