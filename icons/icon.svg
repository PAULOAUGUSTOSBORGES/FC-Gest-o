      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="#0f172a" rx="100" />
  
  <!-- Card Container -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="url(#grad)" stroke="rgba(255,255,255,0.2)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Text Brand -->
  <text x="256" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="170" fill="#ffffff" text-anchor="middle">FC</text>
  
  <!-- Subtitle -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="52" fill="#93c5fd" text-anchor="middle" letter-spacing="4">GESTÃO</text>
</svg>
