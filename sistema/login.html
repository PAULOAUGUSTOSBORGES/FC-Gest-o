<!DOCTYPE html>
<html lang="pt-BR" class="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- Anti-FOUC: Previne flash branco ao alternar páginas no sistema -->
    <script>
        (function() {
            const t = localStorage.getItem('fc_theme_sistema') || 'dark';
            if (t === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                document.documentElement.classList.remove('light');
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
    <style>
        :root { color-scheme: dark; background-color: #0f172a; }
        html, body { background-color: #0f172a; }
        html.light, html.light body, html[data-theme="light"], html[data-theme="light"] body { background-color: #f1f5f9; color-scheme: light; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- PWA Configurações e Ícones -->
    <script>if (window.location.protocol.startsWith('http')) { const l = document.createElement('link'); l.rel = 'manifest'; l.href = '../manifest.json'; document.head.appendChild(l); }</script>
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FC Gestão">
    <link rel="apple-touch-icon" href="../icons/icon-apple-touch.png">
    <link rel="icon" type="image/png" href="../icons/favicon.png">
    <title>Acesso - FC Gestão | ERP & PDV</title>
        
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css?v=20260929103753">
    <link rel="stylesheet" href="../tailwind-built.css?v=20260929103753">
</head>
<body class="flex h-screen bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md text-center relative overflow-hidden my-auto max-h-[95vh] overflow-y-auto custom-scrollbar">
        
        <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-blue-500/50">
            <i class="fa-solid fa-layer-group"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1" id="titulo-form">FC Gestão</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-4" id="subtitulo-form">Acesso ao sistema integrado</p>

        <!-- Banner de Trial 7 Dias Grátis -->
        <div id="badge-trial" class="hidden mb-4 p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-300 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300 text-xs font-semibold flex items-center justify-center gap-2">
            <i class="fa-solid fa-gift text-sm text-emerald-600 dark:text-emerald-400"></i>
            <span>Teste Grátis por 7 Dias sem compromisso!</span>
        </div>

        <!-- Tabs Login / Register -->
        <div class="flex border-b border-slate-200 dark:border-slate-700 mb-5">
            <button id="tab-login" onclick="mudarAbaLogin('login')" class="flex-1 pb-2 font-bold text-blue-600 border-b-2 border-blue-600 transition-colors">Entrar</button>
            <button id="tab-register" onclick="mudarAbaLogin('register')" class="flex-1 pb-2 font-bold text-slate-400 border-b-2 border-transparent transition-colors hover:text-slate-600 dark:hover:text-slate-300">Criar Conta</button>
        </div>
        
        <!-- Formulário -->
        <input type="text" id="login-empresa" placeholder="Nome da Sua Loja / Comércio *" aria-label="Nome da Sua Loja" class="hidden w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg mb-3 focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
        
        <input type="text" id="login-responsavel" placeholder="Seu Nome Completo (Responsável) *" aria-label="Seu Nome Completo" class="hidden w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg mb-3 focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">

        <input type="tel" id="login-telefone" placeholder="WhatsApp com DDD: (00) 00000-0000 *" maxlength="15" aria-label="WhatsApp com DDD" class="hidden w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg mb-3 focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">

        <input type="text" id="login-cidade" placeholder="Cidade / Estado (Ex: Goiânia - GO) *" aria-label="Cidade e Estado" class="hidden w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg mb-3 focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">

        <input type="email" id="login-user" placeholder="E-mail *" aria-label="E-mail" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg mb-3 focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm">
        
        <input type="password" id="login-pass" placeholder="Senha *" aria-label="Senha" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-2.5 rounded-lg mb-5 focus:outline-none focus:border-blue-500 font-medium dark:text-white text-sm" onkeypress="if(event.key === 'Enter') acaoPrincipal()">
        
        <button id="btn-acao" onclick="acaoPrincipal()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">Entrar</button>
        
        <!-- Divisor OU -->
        <div class="flex items-center my-4">
            <div class="flex-1 border-t border-slate-200 dark:border-slate-700"></div>
            <span class="px-3 text-xs text-slate-400 dark:text-slate-500 uppercase font-semibold">ou</span>
            <div class="flex-1 border-t border-slate-200 dark:border-slate-700"></div>
        </div>

        <!-- Botão Google -->
        <button id="btn-google" type="button" onclick="fazerLoginGoogle()" class="w-full flex items-center justify-center gap-3 bg-white dark:bg-slate-900 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 font-semibold py-3 px-4 rounded-lg border border-slate-300 dark:border-slate-700 transition shadow-sm active:scale-[0.98]">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span id="txt-btn-google">Entrar com Google</span>
        </button>
        
        <p class="mt-4 text-sm text-slate-500" id="esqueci-senha-link">
            <a href="#" onclick="esqueciSenha(); return false;" class="text-blue-500 hover:underline">Esqueci minha senha</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
    
    <script src="../sistema/config_banco.js?v=20260929103753"></script>
    <script src="saas_licenca.js?v=20260929103753"></script>
    <script src="../global.js?v=20260929103753"></script>
    <script src="fc_cache.js?v=20260929103753"></script>
    <script src="login.js?v=20260929103753"></script>
</body>
</html>
