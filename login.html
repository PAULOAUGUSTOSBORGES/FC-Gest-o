<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TintasERP</title>
    <!-- Tailwind CSS -->
    <script> 
        window.tailwind = window.tailwind || {}; tailwind.config = { darkMode: 'class' }; 
        (function(){
            document.documentElement.classList.add('dark');
        })();
    </script>
<script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex h-screen bg-slate-900 text-slate-800 dark:text-slate-100 flex items-center justify-center p-4">

    <div id="toast-container"></div>

    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
        <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl mb-4 shadow-lg shadow-blue-500/50">
            <i class="fa-solid fa-droplet"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100 mb-1">TintasERP</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">Acesso ao sistema integrado</p>
        <input type="email" id="login-user" placeholder="E-mail" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-4 focus:outline-none focus:border-blue-500 font-medium dark:text-white">
        <input type="password" id="login-pass" placeholder="Senha" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-600 px-4 py-3 rounded-lg mb-6 focus:outline-none focus:border-blue-500 font-medium dark:text-white" onkeypress="if(event.key === 'Enter') fazerLogin()">
        <button onclick="fazerLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-colors shadow-md">Entrar</button>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js?v=4"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js?v=4"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js?v=4"></script>
    
    <!-- Scripts -->
    <script src="global.js?v=4"></script>
    <script src="login.js?v=4"></script>
</body>
</html>
